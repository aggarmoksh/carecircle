<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CareCircle board</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#15181d;--mut:#5b6573;--line:#dde1e7;--ok:#1b7a3d;--okb:#e3f4e9;--warn:#8a5a00;--warnb:#fff1d6;--bad:#a12020;--badb:#fde4e4;--info:#1e4f9a;--infob:#e4edfb}
*{box-sizing:border-box}body{margin:0;font:14px/1.4 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 20px;background:#15181d;color:#fff}
header h1{font-size:18px;margin:0}header .t{font-variant-numeric:tabular-nums}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px;padding:14px 20px}
section{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px}section.wide{grid-column:1/-1}
h2{font-size:14px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
table{border-collapse:collapse;width:100%}td,th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:12px;color:var(--mut);font-weight:600}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.given,.within,.awake,.real{background:var(--okb);color:var(--ok);border-color:#b9e0c6}
.not_yet_due,.no_range,.asleep{background:#eceff3;color:var(--mut);border-color:var(--line)}
.due,.overdue,.above,.below,.unsure{background:var(--warnb);color:var(--warn);border-color:#f0d9a3}
.missed,.skipped{background:var(--badb);color:var(--bad);border-color:#f3baba}
.sim{background:var(--infob);color:var(--info);border-color:#bcd0f0}
.mut{color:var(--mut)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ladder{border-left:3px solid var(--warn);padding-left:10px;margin:6px 0}
.lab{margin-bottom:12px}.lab h3{font-size:13px;margin:6px 0}
img.org{max-width:100%;border:1px solid var(--line);border-radius:6px;margin-top:6px}.imgs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input,button{font:inherit;padding:4px 8px}button{cursor:pointer}a.btn{padding:4px 10px;background:#fff;color:#15181d;border-radius:5px;text-decoration:none}
svg text{font-size:10px;fill:#5b6573}
</style></head>
<body>
<header><h1>CareCircle board &middot; <span id="patient"></span></h1><div class="row"><span class="t" id="clock"></span><a class="btn" id="doc" href="#">Doctor summary</a></div></header>
<main>
<section><h2>Circle members</h2><table id="members"></table></section>
<section><h2>Today's doses</h2><table id="doses"></table></section>
<section class="wide"><h2>Open escalation ladder</h2><div id="ladder"></div></section>
<section class="wide"><h2>Latest organiser audit</h2><div id="organiser"></div></section>
<section class="wide"><h2>Lab reports</h2><div id="labs"></div><div id="charts"></div></section>
<section><h2>Open tasks</h2><div id="tasks"></div></section>
<section><h2>Demo clock (admin)</h2>
 <div class="row"><input id="atok" type="password" placeholder="ADMIN_TOKEN" size="14"><input id="atime" placeholder="UTC time e.g. 2026-11-03T08:30:00Z" size="30"><button id="bset">Set time</button></div>
 <div class="row" style="margin-top:6px"><input id="aspeed" value="1" size="4"><button id="bspeed">Set speed</button><button id="bnext">Jump to next due dose</button><button id="bnudge">Jump to next due + grace</button></div>
 <div id="amsg" class="mut" style="margin-top:6px"></div></section>
<section class="wide"><h2>Last 20 audit log lines</h2><table id="audit"></table></section>
</main>
<script>
const TOKEN=new URLSearchParams(location.search).get('token')||'';
const $=id=>document.getElementById(id);
function h(tag,attrs,...kids){const e=document.createElement(tag);for(const k in(attrs||{})){if(k==='class')e.className=attrs[k];else e.setAttribute(k,attrs[k])}
 for(const c of kids.flat()){if(c==null)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}return e}
const chip=(cls,txt)=>h('span',{class:'chip '+cls},txt||cls.replace('_',' '));
const WORD={within:"within the lab's printed range",above:"above the lab's printed range",below:"below the lab's printed range",no_range:"no range printed"};
const SWORD={given:'given',not_yet_due:'not yet due',due:'due, not confirmed',overdue:'overdue',skipped:'skipped',unsure:'unsure',missed:'missed'};
function fill(el,...kids){el.replaceChildren(...kids.flat())}
function chart(name,pts){const W=360,H=110,P=26;const xs=pts.map(p=>new Date(p.date).getTime()),ys=pts.map(p=>p.value);
 const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
 const X=t=>P+(x1===x0?0.5:(t-x0)/(x1-x0))*(W-2*P),Y=v=>H-P-(y1===y0?0.5:(v-y0)/(y1-y0))*(H-2*P);
 const NS='http://www.w3.org/2000/svg',s=document.createElementNS(NS,'svg');s.setAttribute('width',W);s.setAttribute('height',H);
 const ad=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);s.append(e);return e};
 ad('polyline',{points:pts.map(p=>X(new Date(p.date).getTime())+','+Y(p.value)).join(' '),fill:'none',stroke:'#1e4f9a','stroke-width':2});
 pts.forEach(p=>{const cx=X(new Date(p.date).getTime()),cy=Y(p.value);ad('circle',{cx,cy,r:4,fill:'#1e4f9a'});
  ad('text',{x:cx,y:cy-8,'text-anchor':'middle'}).textContent=p.value+' '+p.unit;ad('text',{x:cx,y:H-8,'text-anchor':'middle'}).textContent=p.date});
 return h('div',{class:'lab'},h('h3',null,name+' over time (value only; each point has its own lab range in the table above)'),s)}
function render(s){
 $('patient').textContent=s.patient;$('clock').textContent=s.patient_local+' (patient local) · speed x'+s.speed;
 fill($('members'),h('tr',null,h('th',null,'Member'),h('th',null,'Role'),h('th',null,'Local time'),h('th',null,'Now'),h('th',null,'')),
  s.members.map(m=>h('tr',null,h('td',null,m.name,' ',h('span',{class:'mut'},m.relationship)),h('td',null,m.role.replace('_',' ')),h('td',null,m.local+' '+m.city),
   h('td',null,chip(m.awake?'awake':'asleep')),h('td',null,m.simulated?chip('sim','simulated'):chip('real','real')))));
 fill($('doses'),h('tr',null,h('th',null,'Time'),h('th',null,'Medicine'),h('th',null,'Status'),h('th',null,'Who / note')),
  s.doses.map(d=>h('tr',null,h('td',null,d.time),h('td',null,d.medicine),h('td',null,chip(d.status,SWORD[d.status]+(d.late?' (late)':''))),
   h('td',null,[d.by?('by '+d.by):'',d.reported_by?(' · reported by '+d.reported_by):'',d.note?(' · '+d.note):'']))));
 fill($('ladder'),s.ladder.length?s.ladder.map(l=>h('div',{class:'ladder'},h('b',null,l.slot.replace('_',' ')+' · due '+l.due.slice(0,16).replace('T',' ')+'Z '),chip(l.status,SWORD[l.status]||l.status),
   l.steps.map(x=>h('div',null,x.at.slice(11,19)+'Z · '+x.kind+' → '+x.who+(x.note?' ('+x.note+')':''))),
   l.skipped.map(x=>h('div',{class:'mut'},x.at.slice(11,19)+'Z · skipped '+x.who+': '+x.why)),
   (!l.steps.length&&!l.skipped.length)?h('div',{class:'mut'},'waiting for the grace period'):null)):h('div',{class:'mut'},'No open ladder: nothing is overdue.'));
 const o=s.organiser;
 fill($('organiser'),o?[h('div',{class:'mut'},'Document '+o.doc+' · '+o.at),
   o.mismatches.length?h('ul',null,o.mismatches.map(m=>h('li',null,m.text))):h('div',null,'The organiser agrees with the record.'),
   h('div',{class:'imgs'},h('div',null,h('div',{class:'mut'},'Photo'),h('img',{class:'org',src:'/api/doc/'+o.doc+'/photo?token='+encodeURIComponent(TOKEN)})),
    o.has_overlay?h('div',null,h('div',{class:'mut'},'SAM overlay (evidence only)'),h('img',{class:'org',src:'/api/doc/'+o.doc+'/overlay?token='+encodeURIComponent(TOKEN)})):h('div',{class:'mut'},'No overlay stored (SAM did not return exactly 14 masks).'))]:h('div',{class:'mut'},'No organiser photo yet.'));
 fill($('labs'),s.labs.length?s.labs.slice().reverse().map(r=>h('div',{class:'lab'},h('h3',null,r.lab+' · '+r.date+' · confirmed by '+r.confirmed_by),
   h('table',null,h('tr',null,h('th',null,'Test'),h('th',null,'Value'),h('th',null,'Unit'),h('th',null,'Printed range'),h('th',null,'Status')),
    r.tests.map(t=>h('tr',null,h('td',null,t.test),h('td',null,t.value),h('td',null,t.unit),h('td',null,t.range_text||'—'),h('td',null,chip(t.status,WORD[t.status]))))))):h('div',{class:'mut'},'No lab reports yet.'));
 fill($('charts'),Object.entries(s.lab_charts).map(([n,p])=>chart(n,p)));
 fill($('tasks'),s.tasks.length?h('ul',null,s.tasks.map(t=>h('li',null,t.text,' ',h('span',{class:'mut'},'· '+(t.owner||'nobody yet'))))):h('div',{class:'mut'},'No open tasks.'));
 fill($('audit'),h('tr',null,h('th',null,'Time (UTC)'),h('th',null,'Event'),h('th',null,'Who'),h('th',null,'Detail')),s.audit.map(a=>h('tr',null,h('td',null,a.at.slice(0,19).replace('T',' ')),h('td',null,a.kind),h('td',null,a.actor||''),h('td',{class:'mut'},a.detail))));
}
async function poll(){try{const r=await fetch('/api/state?token='+encodeURIComponent(TOKEN));if(r.ok)render(await r.json());else document.body.textContent='Access refused'}catch(e){}}
$('doc').href='/doctor?token='+encodeURIComponent(TOKEN);
async function admin(body){const r=await fetch('/admin/clock',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Token':$('atok').value},body:JSON.stringify(body)});
 $('amsg').textContent=r.ok?'OK: '+JSON.stringify(await r.json()):'Refused ('+r.status+')';poll()}
$('bset').onclick=()=>admin({time:$('atime').value});
$('bspeed').onclick=()=>admin({speed:parseFloat($('aspeed').value)});
$('bnext').onclick=()=>admin({action:'next_due'});
$('bnudge').onclick=()=>admin({action:'next_due_plus_grace'});
poll();setInterval(poll,2000);
</script></body></html>
